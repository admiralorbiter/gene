[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gene"
version = "0.1.0"
description = "Genealogical Epistemic Network Experiments"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "GENE Research Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
