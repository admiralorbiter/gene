name: GENE CI & Reproducibility Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Fetch and verify frozen research artifacts
        run: |
          python scripts/fetch_frozen_artifacts.py --download

      - name: Run pytest test suite
        run: |
          pytest

      - name: Audit documentation and asset links
        run: |
          python scripts/check_doc_links.py

      - name: Rebuild results manifest & Atlas assets
        run: |
          python scripts/generate_results_manifest.py
          python scripts/build_atlas_data.py

      - name: Verify zero evidence drift
        run: |
          git diff --exit-code data/canonical_results_manifest.json
          git diff --exit-code docs/atlas/data/
